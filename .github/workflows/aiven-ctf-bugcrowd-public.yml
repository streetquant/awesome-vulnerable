name: Aiven CTF Bugcrowd public engagement probe

on:
  push:
    branches:
      - aiven-ctf-probe-20260826
    paths:
      - .ctf/aiven/bugcrowd_public_probe.py
      - .github/workflows/aiven-ctf-bugcrowd-public.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated probe branch
        uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium

      - name: Validate probe source
        run: |
          python3 -m py_compile .ctf/aiven/bugcrowd_public_probe.py
          sha256sum .ctf/aiven/bugcrowd_public_probe.py .github/workflows/aiven-ctf-bugcrowd-public.yml

      - name: Render public engagement and capture public requests
        run: python3 .ctf/aiven/bugcrowd_public_probe.py

      - name: Upload public rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiven-ctf-bugcrowd-public-${{ github.run_id }}
          path: probe-output/bugcrowd-public/
          if-no-files-found: error
          retention-days: 1
