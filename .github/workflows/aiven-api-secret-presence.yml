name: Aiven API secret presence and target access probe

on:
  push:
    branches:
      - aiven-ctf-probe-20260826
    paths:
      - .github/workflows/aiven-api-secret-presence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIVEN_TOKEN: ${{ secrets.AIVEN_TOKEN }}
      AIVEN_AUTH_TOKEN: ${{ secrets.AIVEN_AUTH_TOKEN }}
      AIVEN_API_TOKEN: ${{ secrets.AIVEN_API_TOKEN }}
      AVN_TOKEN: ${{ secrets.AVN_TOKEN }}
      BUGCROWD_AIVEN_TOKEN: ${{ secrets.BUGCROWD_AIVEN_TOKEN }}
      AIVEN_CTF_TOKEN: ${{ secrets.AIVEN_CTF_TOKEN }}
      AIVEN_ACCESS_TOKEN: ${{ secrets.AIVEN_ACCESS_TOKEN }}
    steps:
      - name: Probe configured Aiven token candidates without exposing values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import json
          import os
          import ssl
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = 'https://api.aiven.io/v1'
          TARGET_UUID = '812de5da-0bab-4990-90e8-57303eebfd30'
          TARGET_TERMS = (
              'falcon-bug-bounty-flag-pgsql-dev-sandbox',
              'falcon-bug-bounty-flag-pgsql-43',
              'pgsql-43',
          )
          OWNED_BRIDGE_TERMS = ('opensearch', 'bug', 'ctf', 'falcon')
          CANDIDATE_NAMES = (
              'AIVEN_TOKEN',
              'AIVEN_AUTH_TOKEN',
              'AIVEN_API_TOKEN',
              'AVN_TOKEN',
              'BUGCROWD_AIVEN_TOKEN',
              'AIVEN_CTF_TOKEN',
              'AIVEN_ACCESS_TOKEN',
          )

          def request(path: str, token: str, scheme: str) -> tuple[int | None, object | None, str | None]:
              auth = f'{scheme} {token}'
              req = urllib.request.Request(
                  BASE + path,
                  headers={
                      'Authorization': auth,
                      'Accept': 'application/json',
                      'User-Agent': 'authorized-aiven-ctf-secret-presence-probe/1.0',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30, context=ssl.create_default_context()) as response:
                      body = response.read(20_000_000)
                      try:
                          payload = json.loads(body)
                      except Exception:
                          payload = {'non_json_bytes': len(body)}
                      return response.status, payload, None
              except urllib.error.HTTPError as exc:
                  body = exc.read(2_000_000)
                  try:
                      payload = json.loads(body)
                  except Exception:
                      payload = None
                  return exc.code, payload, None
              except Exception as exc:
                  return None, None, f'{type(exc).__name__}: {exc}'

          def project_rows(payload: object) -> list[dict]:
              if not isinstance(payload, dict):
                  return []
              for key in ('projects', 'project'):
                  value = payload.get(key)
                  if isinstance(value, list):
                      return [row for row in value if isinstance(row, dict)]
              return []

          def service_rows(payload: object) -> list[dict]:
              if not isinstance(payload, dict):
                  return []
              value = payload.get('services')
              if isinstance(value, list):
                  return [row for row in value if isinstance(row, dict)]
              if isinstance(payload.get('service'), dict):
                  return [payload['service']]
              return []

          def safe_project(row: dict) -> dict:
              return {
                  'project_name': row.get('project_name') or row.get('name'),
                  'project_id': row.get('project_id') or row.get('id'),
                  'state': row.get('state'),
                  'cloud': row.get('cloud'),
              }

          def safe_service(project_name: str, row: dict) -> dict:
              components = []
              for component in row.get('components') or []:
                  if not isinstance(component, dict):
                      continue
                  route = component.get('route') or ''
                  usage = component.get('usage') or ''
                  host = component.get('host')
                  port = component.get('port')
                  if route in ('dynamic', 'public', 'privatelink', 'private') or usage in ('primary', 'replica'):
                      components.append({'route': route, 'usage': usage, 'host': host, 'port': port})
              return {
                  'project_name': project_name,
                  'service_name': row.get('service_name') or row.get('name'),
                  'service_type': row.get('service_type'),
                  'state': row.get('state'),
                  'cloud_name': row.get('cloud_name'),
                  'plan': row.get('plan'),
                  'node_count': row.get('node_count'),
                  'components': components,
              }

          output = {
              'schema': 'aiven-api-secret-presence-target-access-v1',
              'observed_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
              'candidate_presence': {name: bool(os.environ.get(name)) for name in CANDIDATE_NAMES},
              'attempts': [],
          }

          for name in CANDIDATE_NAMES:
              token = os.environ.get(name) or ''
              if not token:
                  continue
              attempt = {'candidate_name': name, 'token_exposed': False, 'schemes': []}
              authenticated = None
              projects_payload = None
              scheme_used = None
              for scheme in ('Bearer', 'aivenv1'):
                  me_status, _, me_error = request('/me', token, scheme)
                  projects_status, candidate_projects, projects_error = request('/project', token, scheme)
                  attempt['schemes'].append({
                      'scheme': scheme,
                      'me_status': me_status,
                      'me_error': me_error,
                      'projects_status': projects_status,
                      'projects_error': projects_error,
                  })
                  if projects_status == 200:
                      authenticated = True
                      projects_payload = candidate_projects
                      scheme_used = scheme
                      break
              attempt['authenticated'] = bool(authenticated)
              attempt['scheme_used'] = scheme_used
              attempt['target_projects'] = []
              attempt['relevant_services'] = []
              if authenticated:
                  projects = project_rows(projects_payload)
                  for project in projects[:100]:
                      safe = safe_project(project)
                      project_name = safe.get('project_name')
                      project_id = str(safe.get('project_id') or '')
                      project_text = json.dumps(project, sort_keys=True).lower()
                      if TARGET_UUID.lower() in project_text or any(term in project_text for term in TARGET_TERMS):
                          attempt['target_projects'].append(safe)
                      if not project_name:
                          continue
                      encoded = urllib.parse.quote(str(project_name), safe='')
                      status, services_payload, error = request(f'/project/{encoded}/service', token, scheme_used)
                      if status != 200:
                          continue
                      for service in service_rows(services_payload):
                          text = json.dumps(service, sort_keys=True).lower()
                          if any(term in text for term in TARGET_TERMS) or any(term in text for term in OWNED_BRIDGE_TERMS):
                              attempt['relevant_services'].append(safe_service(str(project_name), service))
              output['attempts'].append(attempt)

          print(json.dumps(output, indent=2, sort_keys=True))
          PY
