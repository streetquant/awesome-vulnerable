name: Aiven CTF bounded probe

on:
  push:
    branches:
      - aiven-ctf-probe-20260826
    paths:
      - .ctf/aiven/probe.py
      - .ctf/aiven/discover.py
      - .ctf/aiven/active_scan.py
      - .ctf/aiven/deep_recon.py
      - .github/workflows/aiven-ctf-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out isolated probe branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install bounded network utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils nmap jq

      - name: Validate probe sources and workflow
        run: |
          set -euo pipefail
          sources=(.ctf/aiven/probe.py .ctf/aiven/discover.py .ctf/aiven/active_scan.py)
          if [[ -f .ctf/aiven/deep_recon.py ]]; then sources+=(.ctf/aiven/deep_recon.py); fi
          python3 -m py_compile "${sources[@]}"
          sha256sum "${sources[@]}" .github/workflows/aiven-ctf-probe.yml

      - name: Discover current challenge-derived service names
        run: python3 .ctf/aiven/discover.py

      - name: Recheck exact target and last known endpoint
        run: python3 .ctf/aiven/probe.py

      - name: Probe target-derived passive IP and authoritative DNS
        run: python3 .ctf/aiven/active_scan.py

      - name: Run deeper target-derived reconnaissance
        if: hashFiles('.ctf/aiven/deep_recon.py') != ''
        run: python3 .ctf/aiven/deep_recon.py

      - name: Publish only sanitized reconnaissance summaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest=.ctf/aiven/results/latest
          rm -rf "$dest"
          mkdir -p "$dest"
          find probe-output -type f \( -name 'summary.json' -o -name 'manifest.json' \) -print0 | while IFS= read -r -d '' f; do
            rel=${f#probe-output/}
            safe=$(printf '%s' "$rel" | tr '/' '_')
            cp "$f" "$dest/$safe"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('.ctf/aiven/results/latest')
          files=[]
          for p in sorted(root.glob('*')):
              if p.name == 'INDEX.json' or not p.is_file():
                  continue
              b=p.read_bytes()
              files.append({'path':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'INDEX.json').write_text(json.dumps({'schema':'aiven-ctf-public-sanitized-recon-index-v1','files':files},indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'aiven-ctf-recon-bot'
          git config user.email '81894570+streetquant@users.noreply.github.com'
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m 'Publish sanitized Aiven CTF reconnaissance summaries'
            git push origin HEAD:aiven-ctf-probe-20260826
          fi

      - name: Upload raw probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiven-ctf-bounded-probe-${{ github.run_id }}
          path: probe-output/
          if-no-files-found: error
          retention-days: 1
