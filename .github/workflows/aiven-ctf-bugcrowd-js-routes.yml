name: Aiven CTF Bugcrowd public bundle route inspection

on:
  push:
    branches:
      - aiven-ctf-probe-20260826
    paths:
      - .ctf/aiven/bugcrowd_js_routes.py
      - .github/workflows/aiven-ctf-bugcrowd-js-routes.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated probe branch
        uses: actions/checkout@v4

      - name: Validate source
        run: |
          python3 -m py_compile .ctf/aiven/bugcrowd_js_routes.py
          sha256sum .ctf/aiven/bugcrowd_js_routes.py .github/workflows/aiven-ctf-bugcrowd-js-routes.yml

      - name: Inspect public Bugcrowd bundles
        run: python3 .ctf/aiven/bugcrowd_js_routes.py

      - name: Upload public bundle analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiven-ctf-bugcrowd-js-routes-${{ github.run_id }}
          path: probe-output/bugcrowd-js-routes/
          if-no-files-found: error
          retention-days: 1
