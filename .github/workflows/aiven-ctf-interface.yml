name: Aiven CTF live interface probe

on:
  push:
    branches:
      - aiven-ctf-probe-20260826
    paths:
      - .ctf/aiven/interface_probe.py
      - .ctf/aiven/results/deep-latest/**
      - .github/workflows/aiven-ctf-interface.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aiven-ctf-interface-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated probe branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install protocol clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client openssh-client

      - name: Validate probe source
        run: |
          set -euo pipefail
          python3 -m py_compile .ctf/aiven/interface_probe.py
          sha256sum .ctf/aiven/interface_probe.py .github/workflows/aiven-ctf-interface.yml

      - name: Probe live target-derived interfaces
        run: python3 .ctf/aiven/interface_probe.py

      - name: Publish sanitized interface summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest=.ctf/aiven/results/interface-latest
          rm -rf "$dest"
          mkdir -p "$dest"
          find probe-output/interfaces -type f \( -name 'summary.json' -o -name 'manifest.json' \) -print0 | while IFS= read -r -d '' f; do cp "$f" "$dest/$(basename "$f")"; done
          git config user.name 'aiven-ctf-recon-bot'
          git config user.email '81894570+streetquant@users.noreply.github.com'
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m 'Publish sanitized Aiven CTF interface summary'
            git push origin HEAD:aiven-ctf-probe-20260826
          fi

      - name: Upload raw interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiven-ctf-interface-probe-${{ github.run_id }}
          path: probe-output/interfaces/
          if-no-files-found: error
          retention-days: 1
