name: Aiven CTF documented random-suffix discovery

on:
  push:
    branches:
      - aiven-ctf-probe-20260826
    paths:
      - .ctf/aiven/random_suffix_probe.py
      - .github/workflows/aiven-ctf-random-suffix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated probe branch
        uses: actions/checkout@v4

      - name: Install DNS dependency
        run: python3 -m pip install --disable-pip-version-check dnspython

      - name: Validate source
        run: |
          python3 -m py_compile .ctf/aiven/random_suffix_probe.py
          sha256sum .ctf/aiven/random_suffix_probe.py .github/workflows/aiven-ctf-random-suffix.yml

      - name: Enumerate documented target-specific random suffixes
        run: python3 .ctf/aiven/random_suffix_probe.py

      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiven-ctf-random-suffix-${{ github.run_id }}
          path: probe-output/random-suffix/
          if-no-files-found: error
          retention-days: 1
