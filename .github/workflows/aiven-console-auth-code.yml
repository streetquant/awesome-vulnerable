name: Aiven Console auth-code extraction

on:
  push:
    branches:
      - aiven-ctf-probe-20260826
    paths:
      - .ctf/aiven/console_auth_code.py
      - .github/workflows/aiven-console-auth-code.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated probe branch
        uses: actions/checkout@v4

      - name: Validate source
        run: |
          python3 -m py_compile .ctf/aiven/console_auth_code.py
          sha256sum .ctf/aiven/console_auth_code.py .github/workflows/aiven-console-auth-code.yml

      - name: Extract passive authentication code contexts
        run: python3 .ctf/aiven/console_auth_code.py

      - name: Upload code-context evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiven-console-auth-code-${{ github.run_id }}
          path: probe-output/console-auth-code/
          if-no-files-found: error
          retention-days: 1
