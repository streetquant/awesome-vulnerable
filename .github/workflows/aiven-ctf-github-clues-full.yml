name: Aiven CTF public clue corpus

on:
  workflow_dispatch:
  push:
    branches:
      - aiven-ctf-probe-20260826
    paths:
      - .github/workflows/aiven-ctf-github-clues-full.yml

permissions:
  contents: write

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build bounded public clue corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .ctf/aiven/github_clue_search.py
      - name: Commit public-source corpus
        run: |
          set -euo pipefail
          dest=.ctf/aiven/results/github-clues-corpus
          rm -rf "$dest"
          mkdir -p "$dest"
          cp probe-output/github-clues/github-clue-search.json "$dest/"
          cp probe-output/github-clues/summary.json "$dest/"
          cp probe-output/github-clues/manifest.json "$dest/"
          git config user.name 'aiven-ctf-recon-bot'
          git config user.email '81894570+streetquant@users.noreply.github.com'
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m 'Publish bounded public Aiven CTF clue corpus'
            git push origin HEAD:aiven-ctf-probe-20260826
          fi
